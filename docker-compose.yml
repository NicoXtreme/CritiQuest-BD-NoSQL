
services:
  # MongoDB database
  mongo:
    image: mongo:8
    container_name: critiquest-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: critiquest-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/critiquest
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /
    container_name: critiquest-frontend
    restart: unless-stopped
    ports:
      - "8443:80"
    depends_on:
      - backend

volumes:
  mongo_data:
